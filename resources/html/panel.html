<div class="session-timer-panel">
  <div class="session-timer-clock" id="session-elapsed" role="timer" aria-label="Elapsed session time">00:00:00</div>
  <div class="session-timer-options">
    <label class="session-timer-option">
      <input type="checkbox" id="session-overlay-toggle" />
      <span>Show on chatbox</span>
    </label>
    <label class="session-timer-option">
      <input type="checkbox" id="session-overlay-background-toggle" />
      <span>Show background</span>
    </label>
  </div>
  <p class="session-timer-warning"><strong>IMPORTANT:</strong> Timer will reset if plugin is disabled</p>
</div>
